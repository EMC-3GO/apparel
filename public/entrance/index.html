<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer"><title>ANFFEL — Private access</title>
<link rel="stylesheet" href="/entrance/style.css"><script src="/entrance/access.js" defer></script>
</head>
<body>
<main>
<img class="logo" src="/anffel-logo.png" alt="ANFFEL" width="300">
<div class="divider"></div>
<section id="login" hidden>
<p class="eyebrow">PRIVATE ACCESS</p><h1>パスワードを入力</h1><p class="description">ANFFELの管理画面へ進みます。</p>
<form id="form"><label for="password">パスワード</label><input id="password" name="password" type="password" autocomplete="current-password" required maxlength="1024"><button id="submit" type="submit">確認する <span aria-hidden="true">→</span></button></form>
</section>
<section id="success" hidden>
<p class="eyebrow">ACCESS GRANTED</p><h1>認証が完了しました</h1><p class="description">下のボタンから管理画面を開けます。</p>
<a class="primary" href="/api/access?action=open">ANFFELを開く <span aria-hidden="true">↗</span></a><button id="logout" class="quiet" type="button">ロックする</button>
</section>
<p id="message" role="status" aria-live="polite">確認しています…</p>
<footer>ANFFEL <span>PRIVATE WORKSPACE</span></footer>
</main>
</body></html>
